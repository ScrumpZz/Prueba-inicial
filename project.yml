# Proyecto Xcode generado con XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate
#
# IMPORTANTE: reemplaza "com.tunombre" por tu propio identificador
# (ver README.md, sección "Configuración").
name: Freno
options:
  bundleIdPrefix: com.tunombre
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Pon aquí tu Team ID de Apple Developer (o elígelo en Xcode > Signing)
    DEVELOPMENT_TEAM: ""

targets:
  Freno:
    type: application
    platform: iOS
    sources: [Freno, Shared]
    info:
      path: Freno/Info.plist
      properties:
        CFBundleDisplayName: Freno
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [instagram, snssdk1233, fb, twitter, youtube]
    entitlements:
      path: Freno/Freno.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.tunombre.freno]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunombre.freno
    dependencies:
      - target: FrenoMonitor
      - target: FrenoShieldConfiguration
      - target: FrenoShieldAction

  # Se ejecuta en segundo plano: vuelve a bloquear cuando se acaba el tiempo.
  FrenoMonitor:
    type: app-extension
    platform: iOS
    sources: [FrenoMonitor, Shared]
    info:
      path: FrenoMonitor/Info.plist
      properties:
        CFBundleDisplayName: FrenoMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FrenoMonitorExtension
    entitlements:
      path: FrenoMonitor/FrenoMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.tunombre.freno]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunombre.freno.monitor

  # Pantalla que aparece encima de Instagram/TikTok cuando están bloqueadas.
  FrenoShieldConfiguration:
    type: app-extension
    platform: iOS
    sources: [FrenoShieldConfiguration, Shared]
    info:
      path: FrenoShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: FrenoShieldConfiguration
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: FrenoShieldConfiguration/FrenoShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.tunombre.freno]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunombre.freno.shieldconfig

  # Maneja los botones de esa pantalla de bloqueo.
  FrenoShieldAction:
    type: app-extension
    platform: iOS
    sources: [FrenoShieldAction, Shared]
    info:
      path: FrenoShieldAction/Info.plist
      properties:
        CFBundleDisplayName: FrenoShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: FrenoShieldAction/FrenoShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.tunombre.freno]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunombre.freno.shieldaction
